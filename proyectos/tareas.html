<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lista de tareas</title><link rel="stylesheet" href="../style.css"></head><body><main><section><div class="card"><h2>Lista de tareas</h2><div style="display:flex;gap:8px"><input id="task" placeholder="Nueva tarea"><button class="btn" onclick="add()">Agregar</button></div><ul id="list" style="list-style:none;margin-top:20px"></ul></div><a class="back" href="../proyectos.html">← Volver a proyectos</a></section></main><script>let tasks=JSON.parse(localStorage.getItem('jpla_tasks')||'[]');function save(){localStorage.setItem('jpla_tasks',JSON.stringify(tasks));draw()}function add(){let x=document.getElementById('task'),v=x.value.trim();if(v){tasks.push({t:v,d:false});x.value='';save()}}function draw(){let l=document.getElementById('list');l.innerHTML=tasks.map((x,i)=>`<li style="padding:12px 0;border-bottom:1px solid #334155"><input type="checkbox" ${x.d?'checked':''} onchange="tasks[${i}].d=this.checked;save()"> <span style="${x.d?'text-decoration:line-through;color:#64748b':''}">${x.t}</span> <button onclick="tasks.splice(${i},1);save()" style="float:right;background:#334155;color:white;border:0;padding:5px 9px;border-radius:6px">Eliminar</button></li>`).join('')}draw()</script></body></html>
