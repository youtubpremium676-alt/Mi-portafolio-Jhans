<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculadora</title><link rel="stylesheet" href="../style.css"></head><body><main><section><div class="card"><h2>Calculadora</h2><input id="a" type="number" placeholder="Primer número"><br><br><input id="b" type="number" placeholder="Segundo número"><div class="btns"><button class="btn" onclick="calc('+')">+</button><button class="btn" onclick="calc('-')">−</button><button class="btn" onclick="calc('*')">×</button><button class="btn" onclick="calc('/')">÷</button></div><h3 id="r" style="margin-top:20px">Resultado: —</h3></div><a class="back" href="../proyectos.html">← Volver a proyectos</a></section></main><script>function calc(op){let a=Number(document.getElementById('a').value),b=Number(document.getElementById('b').value),r=op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:b===0?'No se puede dividir entre 0':a/b;document.getElementById('r').textContent='Resultado: '+r}</script></body></html>
